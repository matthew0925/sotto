name: Sotto
options:
  bundleIdPrefix: com.takashi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  Sotto:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SafeLine
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: そっと
        # Required for CheckInManager's check-in location tracking.
        NSLocationWhenInUseUsageDescription: 見守りチェックイン中に、現在地を信頼できる連絡先へ共有するために使用します。
        # Required for JournalLock's Face ID gate on the journal screen.
        NSFaceIDUsageDescription: 記録（ジャーナル）を本人以外に見られないよう、Face IDで保護するために使用します。
        # Required for JournalView's PhotosPicker (journal photo attachments).
        NSPhotoLibraryUsageDescription: 記録に写真を添付するために使用します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # sotto:// deep link scheme, used by SottoWidget (home/lock screen
        # widgets) to open directly to the SOS screen or check-in tab.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sotto
            CFBundleURLName: com.takashi.sotto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takashi.sotto
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XV92DHDWYL
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Auto-registers every other App Icon set in Assets.xcassets
        # (IconPastel/IconMono/IconMinimal) as an alternate icon, matching
        # IconManager's AppIconOption raw values — no manual CFBundleIcons/
        # CFBundleAlternateIcons plist entries needed. Without any alternate
        # icon sets actually present in the catalog, UIApplication.shared.
        # supportsAlternateIcons returns false, which is why the picker
        # showed "この端末ではアイコンの切り替えに対応していません" before
        # these placeholder icon images existed.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
    scheme:
      gatherCoverageData: false
      testTargets:
        - SottoTests
    dependencies:
      - target: SottoWidgetExtension
        embed: true

  SottoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SottoTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XV92DHDWYL
    dependencies:
      - target: Sotto

  SottoWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SottoWidget
    info:
      path: Generated-Widget-Info.plist
      properties:
        CFBundleDisplayName: そっと
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takashi.sotto.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XV92DHDWYL
        SKIP_INSTALL: "YES"
